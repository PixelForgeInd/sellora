name: Deploy Sellora to Netlify and Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellora-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build API and frontend
        run: npm run build
        env:
          VITE_API_URL: https://sellora-api.onrender.com/api

      - name: Deploy frontend to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=apps/web/dist --functions=apps/web/netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          VITE_API_URL: https://sellora-api.onrender.com/api

      - name: Trigger Render API deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing GitHub Actions secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

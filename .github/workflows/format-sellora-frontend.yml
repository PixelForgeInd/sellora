name: Format Sellora frontend

on:
  pull_request:
    branches: [develop]
    paths:
      - "apps/web/src/SelloraApp.tsx"
      - ".github/workflows/format-sellora-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format SelloraApp.tsx
        run: npx --yes prettier@3.5.3 --write apps/web/src/SelloraApp.tsx
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/SelloraApp.tsx
            git commit -m "style: format SelloraApp component"
            git push
          else
            echo "SelloraApp.tsx is already formatted."
          fi

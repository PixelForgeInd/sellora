
name: Sellora CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop, feature/v2-dynamic-catalogue]
  pull_request:
    branches: [main, develop, feature/v2-dynamic-catalogue]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Build the latest self-service catalogue flow before merge, including the API and web TypeScript checks.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build application
        run: npm run build
